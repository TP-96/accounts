# Runs Hearth's automatic tests on every change. GitHub emails the repo owner if they fail.
name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - name: Server tests (embedded Postgres)
        run: npm test --prefix server
      - name: Server tests (production database driver)
        run: npm run test:pg --prefix server
      - name: Receipt parser tests
        run: npm test --prefix client
      - name: Build website
        run: npm run build --prefix client
