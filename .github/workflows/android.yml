# Builds an installable Android test app (debug APK) when you start it from the Actions tab
# (Actions → Android test build → Run workflow). Download it from the run's "Artifacts" section.
# Needs a repository variable HEARTH_API_URL = your Vercel URL (Settings → Secrets and variables → Actions → Variables).
name: Android test build
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check API URL is set
        run: |
          if [ -z "${{ vars.HEARTH_API_URL }}" ]; then
            echo "::error::Set the HEARTH_API_URL repository variable to your Vercel URL (e.g. https://hearth.vercel.app)"; exit 1
          fi
      - name: Build web app for mobile
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.HEARTH_API_URL }}
        run: |
          npm ci
          npx vite build --mode mobile
          npx cap sync android
      - name: Build APK
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-android-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
